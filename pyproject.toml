[project]
name = "moose-pde-artifact"
version = "0.11.0"
description = "Anonymous paper artifact for PDE-grounded MOOSE simulation-code evaluation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agent-client-protocol==0.6.3",
    "aiofiles==25.1.0",
    "aiohttp==3.13.2",
    "typer==0.20.0",
    "kosong==0.22.0",
    "loguru==0.7.3",
    "patch-ng==1.19.0",
    "prompt-toolkit==3.0.52",
    "pillow==12.0.0",
    "pyyaml==6.0.3",
    "rich==14.2.0",
    "ripgrepy==2.2.0",
    "streamingjson==0.0.5",
    "trafilatura==2.0.0",
    "tenacity==9.1.2",
    "fastmcp==2.12.5",
    "pydantic==2.12.4",
    "httpx[socks]==0.28.1",
    # Multi-agent system dependencies
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "google-genai>=0.3.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.9",
]

[dependency-groups]
# Development tools (linting, testing, building)
# Install with: uv sync --group dev
dev = [
    "inline-snapshot[black]>=0.31.1",
    "pyinstaller>=6.16.0",
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.4",
]


[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["codmos"]
source-exclude = ["tests/**/*", "src/codmos/deps/**/*"]

[project.scripts]
codmos = "codmos.cli:cli"

[tool.ruff]
line-length = 100
extend-exclude = [
    "tools/",           # Offline tools (not production code)
    "tests/test_*.py",  # Test files (less strict linting)
    "docs/",            # Documentation
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
# Ignore certain rules for test files and data processing
ignore = [
    "E501",   # Line too long (allow long lines in data processing)
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.typos.files]
extend-exclude = ["codmos.spec", "pyinstaller.py"]

[tool.typos.default.extend-words]
datas = "datas"
